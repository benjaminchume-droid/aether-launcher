name: Build Aether APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          AETHER_KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 }}
        run: |
          test -n "$AETHER_KEYSTORE_BASE64" || { echo "Missing AETHER_KEYSTORE_BASE64 repository secret"; exit 1; }
          printf '%s' "$AETHER_KEYSTORE_BASE64" | base64 --decode > aether-release.keystore
          test -s aether-release.keystore

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          AETHER_KEYSTORE_PASSWORD: ${{ secrets.AETHER_KEYSTORE_PASSWORD }}
          AETHER_KEY_ALIAS: ${{ secrets.AETHER_KEY_ALIAS }}
          AETHER_KEY_PASSWORD: ${{ secrets.AETHER_KEY_PASSWORD }}
        run: |
          test -n "$AETHER_KEYSTORE_PASSWORD" || { echo "Missing AETHER_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$AETHER_KEY_ALIAS" || { echo "Missing AETHER_KEY_ALIAS repository secret"; exit 1; }
          test -n "$AETHER_KEY_PASSWORD" || { echo "Missing AETHER_KEY_PASSWORD repository secret"; exit 1; }
          gradle --no-daemon assembleRelease

      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: aether-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
