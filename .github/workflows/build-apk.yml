name: Build Aether APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  AETHER_KEYSTORE_PASSWORD: ${{ secrets.AETHER_KEYSTORE_PASSWORD || vars.AETHER_KEYSTORE_PASSWORD }}
  AETHER_KEY_ALIAS: ${{ secrets.AETHER_KEY_ALIAS || vars.AETHER_KEY_ALIAS }}
  AETHER_KEY_PASSWORD: ${{ secrets.AETHER_KEY_PASSWORD || vars.AETHER_KEY_PASSWORD }}
  AETHER_KEYSTORE_PATH: aether-release.keystore

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Aether signing key
        env:
          AETHER_KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 || vars.AETHER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$AETHER_KEYSTORE_BASE64" ]; then
            echo "::error::Missing AETHER_KEYSTORE_BASE64. The release APK must use the same signing key as previous installs."
            exit 1
          fi
          printf '%s' "$AETHER_KEYSTORE_BASE64" | base64 --decode > "$AETHER_KEYSTORE_PATH"
          test -s "$AETHER_KEYSTORE_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
