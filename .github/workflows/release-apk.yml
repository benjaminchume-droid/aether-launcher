name: Build and verify Aether Launcher APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/release-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aether-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    name: Build, sign, and verify universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate release signing secrets
        shell: bash
        env:
          AETHER_RELEASE_KEYSTORE_BASE64: ${{ secrets.AETHER_RELEASE_KEYSTORE_BASE64 }}
          AETHER_KEYSTORE_PASSWORD: ${{ secrets.AETHER_KEYSTORE_PASSWORD }}
          AETHER_KEY_ALIAS: ${{ secrets.AETHER_KEY_ALIAS }}
          AETHER_KEY_PASSWORD: ${{ secrets.AETHER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in AETHER_RELEASE_KEYSTORE_BASE64 AETHER_KEYSTORE_PASSWORD AETHER_KEY_ALIAS AETHER_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          printf '%s' "$AETHER_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aether-release.keystore"
          test -s "$RUNNER_TEMP/aether-release.keystore"
          echo "AETHER_KEYSTORE_PATH=$RUNNER_TEMP/aether-release.keystore" >> "$GITHUB_ENV"
          echo "AETHER_KEYSTORE_PASSWORD=$AETHER_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AETHER_KEY_ALIAS=$AETHER_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AETHER_KEY_PASSWORD=$AETHER_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests and build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean testReleaseUnitTest assembleRelease

      - name: Verify APK integrity, signature, and package identity
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::Expected release APK was not generated"; exit 1; }

          # This project deliberately does not configure ABI splits; one APK must serve
          # supported devices without requiring a separate per-architecture download.
          mapfile -t APKS < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#APKS[@]}" -ne 1 ] || [ "${APKS[0]}" != "$APK" ]; then
            echo "::error::Expected exactly one universal release APK, found: ${APKS[*]:-none}"
            exit 1
          fi

          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/aether-badging.txt"
          grep -F "package: name='orubus.aether.launcher'" "$RUNNER_TEMP/aether-badging.txt"
          sha256sum "$APK" | tee "$APK.sha256"
          printf 'APK=%s\n' "$APK" >> "$GITHUB_STEP_SUMMARY"
          printf 'Package: `orubus.aether.launcher`\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'ZIP integrity, APK signature, and package identifier verified.\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'SHA-256:\n\n```\n' >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish verified APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: aether-launcher-universal-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
